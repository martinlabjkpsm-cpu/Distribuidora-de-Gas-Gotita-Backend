spring.application.name=backend
server.port=8080
# Escucha en las interfaces de red de EC2.
server.address=0.0.0.0

# --- Base de datos (AWS RDS PostgreSQL) ---
# Los valores reales van en variables de entorno, nunca en el repositorio.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Las tablas las crea db/01_crear_tablas.sql. validate: al arrancar, Hibernate comprueba que cada entidad
# coincide con su tabla (nombres y tipos) y no modifica la base. Si algo no coincide, la API no arranca y lo indica.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
# JWT_SECRET: clave HS256 de al menos 32 caracteres (variable de entorno).
gotita.jwt.secreto=${JWT_SECRET}
gotita.jwt.emisor=gas-gotita-api
gotita.jwt.destinatario=gas-gotita-web
# Vigencia del token (por defecto 30). Para probar la expiración: JWT_MINUTOS=1
gotita.jwt.minutos=${JWT_MINUTOS:30}

# --- CORS: orígenes del frontend permitidos (separados por coma) ---
gotita.cors.origenes=${CORS_ORIGINS:http://localhost:5173}

# --- Datos iniciales ---
# Si DEMO_PASSWORD existe, los usuarios de ejemplo de db/02_datos_ejemplo.sql reciben el hash BCrypt de esa contraseña.
gotita.demo.password=${DEMO_PASSWORD:}

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
